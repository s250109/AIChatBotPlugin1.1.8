name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f build.gradle ]; then
            gradle build
          elif [ -f build.gradle.kts ]; then
            gradle build
          elif [ -f pom.xml ]; then
            mvn -B package
          else
            echo "Keine Build-Datei gefunden"
            ls -la
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AIChatbotPlugin
          path: |
            build/libs/*.jar
            target/*.jar
          if-no-files-found: error

