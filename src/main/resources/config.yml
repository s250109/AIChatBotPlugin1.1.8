# IMPORTANT: Minehut cannot reach your own PC via localhost.
# Set base-url to an Ollama server that is reachable from the Minehut server.
ai:
  provider: "groq"
  api-key: ""
  model: "openai/gpt-oss-120b"
  base-url: "https://api.groq.com/openai/v1"
  max-tokens: 300
  cooldown-seconds: 3
  history-size: 10
  request-timeout-seconds: 30
  system-prompt: "You are a helpful assistant on a Minecraft server. Always reply in English, keep answers short (maximum 3 sentences), be friendly, and do not use Markdown. And you can use some emojis."
messages:
  prefix: "&8[&bAI&8] &r"
  usage: "&eVerwendung: /ai <Nachricht>"
  thinking: "&7Die KI denkt nach..."
  error: "&cDie KI ist gerade nicht erreichbar. Bitte versuche es später erneut."
  cooldown: "&cBitte warte noch {seconds} Sekunden."
  no-permission: "&cDu darfst diesen Befehl nicht verwenden."
  reloaded: "&aKonfiguration neu geladen."
