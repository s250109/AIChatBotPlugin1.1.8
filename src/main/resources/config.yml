
# Enter your API-Key at api-key. You can get a key at https://console.groq.com/keys .
ai:
  provider: "groq"
  api-key: ""
  model: "openai/gpt-oss-120b"
  base-url: "https://api.groq.com/openai/v1"
  max-tokens: 300
  cooldown-seconds: 3
  history-size: 10
  request-timeout-seconds: 30
  system-prompt: "You are a helpful assistant on a Minecraft server. Always reply in English, keep answers short (maximum 3 sentences), be friendly, and do not use Markdown. You can use !,?, !? and ?!. Answer like Chat GPT. "
messages:
  prefix: "&8[&bAI&8] &r"
  usage: "&eUse: /ai <text>"
  thinking: "&7AI is thinking..."
  error: "&cThe AI ​​is currently unavailable. Please try again later."
  cooldown: "&cPlease wait {seconds} Seconds."
  no-permission: "&cYou don't have permissions to do that."
  reloaded: "&aSuccesfully reloaded."
